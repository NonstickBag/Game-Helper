<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../style/home.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">My Dashboard</div>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <div id="adminNavLinks" style="display: none; gap: 1rem;">
                <a href="./administration.html" style="color: #3b82f6; text-decoration: none; font-weight: bold;">Admin Panel</a>
            </div>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
    </nav>
    
    <main class="content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem;">
            <h1 id="welcomeMessage" style="margin: 0;">Welcome!</h1>
            <div style="display: flex; gap: 1rem;">
                <a href="./my-requests.html" style="background-color: #3b82f6; color: white; padding: 0.75rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: bold; transition: 0.2s;">📋 My Requests</a>
                <a href="./request.html" style="background-color: #22c55e; color: white; padding: 0.75rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: bold; transition: 0.2s;">+ Request Custom Script</a>
            </div>
        </div>
        
        <p>Explore our premium components below.</p>
        <div id="productGrid" class="product-grid"></div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../script.js"></script>
    <!-- Floating Theme Toggle Button -->
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle Dark/Light Mode">
        <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <!-- Default Moon Icon -->
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>
    </button>
</body>
</html>
